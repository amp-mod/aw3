<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>It's raining Apple Cats... - AmpMod</title>
		<style>
			:root {
				--bg-color: #ffffff;
				--text-color: #1a1a1a;
				--link-color: #2e7d32;
				--link-hover: #1b5e20;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg-color: #141414;
					--text-color: #ffffff;
					--link-color: #77ce84;
					--link-hover: #a2dfab;
				}
			}

			body {
				font-family: sans-serif;
				display: flex;
				flex-direction: column;
				margin: auto;
				padding: 20px;
				max-width: 600px;
				background: var(--bg-color);
				color: var(--text-color);
			}
			.container {
				display: flex;
				flex-direction: column;
				padding: 5px 10px;
				background: #f002;
				border-radius: 6px;
				border: 1px red solid;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<img src="/drizzling.svg" height="200" />
			<p>It's raining Apple Cats...</p>
			<p>
				If this error keeps showing even after reloading, please check the AmpMod status page for
				more information on potential outages.
			</p>
		</div>
	</body>
</html>
