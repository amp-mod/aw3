<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%sveltekit.status% - AmpMod</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        display: flex;
        flex-direction: column;
        margin: auto;
        height: 100%;
        padding: 0;
        padding-top: 100px;
        max-width: 600px;
        background: #141414;
        color: white;
        text-align: center;
      }
      h1 {
        font-size: 5rem;
        margin: 0;
        font-family: monospace;
        text-align: center;
        color: #ff6467;
      }
      p {
        font-size: 1.2rem;
        margin-bottom: 0;
      }
      a,
      .fakelink {
        border: 0;
        padding: 0;
        background: none;
        font-size: 1em;
        color: #77ce84;
        font-weight: bold;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>%sveltekit.status%</h1>
    <p>Oops! Something went wrong.</p>
    <p>%sveltekit.error.message%</p>
    <p><button class="fakelink" onclick="location.reload()">Try again</button></p>
    <p><a href="/">Back to Home</a></p>
  </body>
</html>
