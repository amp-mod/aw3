<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
         unfortunately we can't really use anything looser due to custom extensions being a thing.
         for now this attempts to match what the AmpMod compiler and most extensions need.
      -->
		<meta
			http-equiv="Content-Security-Policy"
			content="
            default-src * data: blob:; 
            script-src * 'unsafe-inline' 'unsafe-eval' data: blob:; 
            worker-src 'self' blob:;
            style-src * 'unsafe-inline'; 
            img-src * data: blob:; 
            connect-src * data: blob:;
      "
		/>
		<!-- 100% privacy-first analytics -->
		<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
		<meta
			name="description"
			content="AmpMod is a block-based programming language built off TurboWarp that adds many small but meaningful features to make it even better, such as first-class lists, case sensitivity, and custom extensions."
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
